<!doctype html>
<!--
  HiveMind — live 3D view of the surveyed world.

  Why this exists: every other surface HQ offers is built for a language model, which means it
  summarises. `world.query` answers "2.7% mapped" and that is exactly right for planning. It is
  useless for the question a human actually asks, which is "why did the drone stop THERE?" —
  a question about shape, and shape does not survive being turned into a number.

  What it shows, in the order it earns its keep:

    - INTENT, not just position. A drone marker tells you where something is; a task box tells you
      what it was told to do and where. The second is the one that catches a scout surveying a
      region it is nowhere near — which is exactly the class of bug that hid in this fleet for
      days, because every individual component reported itself healthy.
    - THE CONTROL PLANE. Drones heartbeat; the computers that command them did not report at all,
      so five idle turtles looked identical whether there was no work or TaskMan had been dead
      since the last chunk unload.
    - WHAT the terrain is, not merely that it is solid.

  Design rules:

    - ONE poll for everything that moves, separate and slower for terrain. The occupancy grid is
      ~100KB and changes only when a scout surveys; drone positions change constantly.
    - The page never fails as a whole. Each source is drawn if present and named if absent,
      because "tasks unavailable" is information and a blank canvas is not.
    - Absent is not air, and unidentified is not absent. The grid distinguishes surveyed-air (0)
      from never-surveyed (missing); the block index identifies only a subset of the solid cells.
      Three states, drawn as three states.

  Three.js is vendored under /map/vendor. Not a CDN: this runs on a LAN behind Pi-hole with no
  guarantee of internet, and a visualiser that goes blank when WAN drops is worse than no
  visualiser, because it looks like the fleet died.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HiveMind — world map</title>
<link rel="icon" href="data:,">

<style>
  :root {
    --bg: #0a0d12;
    --panel: rgba(14, 19, 27, 0.88);
    --edge: rgba(120, 160, 200, 0.18);
    --ink: #d7e2ee;
    --dim: #7d8ea2;
    --ok: #57d38c;
    --bad: #f2616b;
    --warn: #f0b45e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
               overflow: hidden; -webkit-text-size-adjust: 100%; }
  canvas { display: block; touch-action: none; }

  .panel {
    position: fixed; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  #hud    { top: 12px; left: 12px; width: 250px; max-height: calc(100vh - 24px); overflow: auto; }
  #side   { top: 12px; right: 12px; width: 286px; max-height: calc(100vh - 24px); overflow: auto; }
  #legend { bottom: 12px; left: 12px; }

  h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .09em; text-transform: uppercase; color: #9fb6cd; }
  h2 { font-size: 11px; margin: 13px 0 6px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
       border-top: 1px solid var(--edge); padding-top: 9px; }
  h2:first-of-type { border-top: 0; }

  .row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
  .row .k { color: var(--dim); }
  .row .v { color: var(--ink); text-align: right; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* One entity — drone, task or computer. Whole card is the hover target so the pointer does not
     have to find 8px of text. */
  .card { border-left: 3px solid var(--accent, #666); padding: 5px 8px; margin: 4px 0;
          border-radius: 0 5px 5px 0; background: rgba(255,255,255,.028); transition: background .12s; }
  .card:hover, .card.hot { background: rgba(255,255,255,.1); }
  .card .name { font-weight: 700; }
  .card .meta { color: var(--dim); font-size: 11px; }
  .card .pos  { color: #8fa9c4; font-size: 11px; }
  .card .warn { color: var(--warn); font-size: 11px; }
  .card .log  { color: #6f8298; font-size: 10.5px; white-space: nowrap; overflow: hidden;
                text-overflow: ellipsis; font-style: italic; }
  .drone { cursor: pointer; }

  .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; }

  label.toggle { display: flex; align-items: center; gap: 7px; padding: 2px 0; color: var(--dim); cursor: pointer; }
  label.toggle:hover { color: var(--ink); }
  input[type=checkbox] { accent-color: #5aa9e6; margin: 0; width: 15px; height: 15px; }

  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* Block colour key. Two columns because the names are short and the panel sits over the scene —
     a single tall column would cover the terrain it is describing. */
  #legend { max-width: 404px; }
  .lg   { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
  .lg span { display: flex; align-items: center; gap: 6px; padding: 1px 0; color: var(--dim);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .lg span .swatch { flex: none; }
  .lg-h { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #6f8298;
          border-top: 1px solid var(--edge); margin-top: 7px; padding-top: 6px; }
  #legend-blocks > .lg-h:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .muted { color: var(--dim); }
  .note { color: var(--warn); font-size: 11px; line-height: 1.35; margin: 4px 0 0; }

  #err { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
         background: rgba(70, 16, 22, .93); border: 1px solid #7d2b33; color: #ffd9dc;
         padding: 7px 14px; border-radius: 7px; display: none; max-width: 70vw; z-index: 20; }
  #tip { position: fixed; pointer-events: none; display: none; z-index: 30; max-width: 260px; }

  /* ── mobile ──────────────────────────────────────────────────────────────
     Phones get a tab bar and one panel at a time. The panels are the same DOM — collapsing rather
     than duplicating means there is no second layout to keep in sync, and the 3D view keeps the
     whole screen by default, which is the thing you came to look at. */
  /* The inset goes on the TOP only — a notch is above the bar, not below it. Folding it into the
     shorthand's bottom value padded the wrong edge on exactly the devices that have one. */
  #tabs { position: fixed; top: 0; left: 0; right: 0; display: none; z-index: 25;
          background: rgba(10,13,18,.92); border-bottom: 1px solid var(--edge);
          padding: calc(6px + env(safe-area-inset-top, 0px)) 8px 6px; gap: 6px; }
  #tabs button { flex: 1; background: rgba(255,255,255,.05); color: var(--dim);
                 border: 1px solid var(--edge); border-radius: 6px; padding: 8px 4px;
                 font: inherit; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  #tabs button.on { background: rgba(90,169,230,.18); color: var(--ink); border-color: #5aa9e6; }

  @media (max-width: 760px), (pointer: coarse) and (max-width: 1024px) {
    #tabs { display: flex; }
    #hud, #side, #legend {
      top: auto; left: 8px; right: 8px; bottom: 8px; width: auto;
      max-height: 52vh; overflow: auto; display: none;
    }
    body.show-hud    #hud    { display: block; }
    body.show-side   #side   { display: block; }
    body.show-legend #legend { display: block; }
    #err { bottom: auto; top: calc(58px + env(safe-area-inset-top, 0px)); max-width: 92vw; }
    /* Touch targets. A 15px checkbox is a miss on a phone. */
    label.toggle { padding: 7px 0; }
    input[type=checkbox] { width: 20px; height: 20px; }
    #tip { display: none !important; }   /* no hover on touch; the panel is the readout */
  }
</style>

  <div class="row"><span class="k"><i class="swatch" style="background:#ffe14d"></i> gather</span>

<script type="importmap">
{ "imports": { "three": "/map/vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/map/vendor/OrbitControls.js';

// How often each source is re-read. The terrain interval is longer than the server's cache on
// purpose: polling faster only burns bandwidth to re-receive bytes we were just told are current.
const STATE_MS = 3_000;
const VOXEL_MS = 15_000;

const ROLE_COLOR = { miner: 0xe0a33c, scout: 0x4fc3e8, loader: 0x7de08a };
const OFFLINE_COLOR = 0x8a94a3;
const VERB_COLOR = {
  dig: 0xff8a4c, quarry: 0xff8a4c,
  survey: 0x4fc3e8, scan: 0x4fc3e8,
  gather: 0xffe14d, lumber: 0x7de08a, build: 0x6f9bff,
};
const DEAD = new Set(['offline', 'lost', 'stranded', 'stuck']);

/**
 * How far above the surveyed ground a drone has to be before the map says so.
 *
 * Not an arbitrary threshold: a scout that climbs over an obstacle and never comes back down
 * ratchets upward a block at a time, and by the time anyone notices it is scanning empty sky
 * a hundred blocks up while reporting itself perfectly healthy. Position alone does not show that
 * — only position RELATIVE to the terrain it was sent to survey does.
 */
const HIGH_ABOVE_GROUND = 12;

// ── scene ──────────────────────────────────────────────────────────────────

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);
scene.fog = new THREE.Fog(0x0a0d12, 70, 320);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.92;

// Lit brighter than a normal scene would need. Three treats the values we set as sRGB and works in
// linear space, so a mid-grey block ends up much darker on screen than its number suggests.
scene.add(new THREE.AmbientLight(0xbcd3ea, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(1, 2, 0.8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fa8ff, 0.65);
rim.position.set(-1, 0.4, -1);
scene.add(rim);

const gTerrain = new THREE.Group();
const gAir     = new THREE.Group();
const gCaves   = new THREE.Group();
const gMats    = new THREE.Group();
const gTasks   = new THREE.Group();
const gNodes   = new THREE.Group();
const gDrones  = new THREE.Group();
scene.add(gTerrain, gAir, gCaves, gMats, gTasks, gNodes, gDrones);
gAir.visible = false;

const CUBE = new THREE.BoxGeometry(1, 1, 1);

/** Empty a group and release its GPU buffers. Forgetting this leaks a full grid every refresh. */
function clearGroup(g) {
  for (const child of g.children.slice()) {
    g.remove(child);
    // Every terrain mesh instances the SAME unit cube. Disposing it here would free the one
    // geometry the next rebuild is about to instance again, forcing a needless re-upload of the
    // buffer every single refresh.
    if (child.geometry !== CUBE) child.geometry?.dispose?.();
    if (child.material) for (const m of [].concat(child.material)) { m.map?.dispose?.(); m.dispose?.(); }
  }
}

// ── block colours ──────────────────────────────────────────────────────────

/**
 * Block name -> appearance, by substring, most specific first.
 *
 * WHERE THE NUMBERS COME FROM. These are not eyeballed. Every `c` below is the mean of the actual
 * 1.21.1 texture's opaque pixels — vanilla out of the client jar, Create/CreatePropulsion/CC out of
 * the pack's own mod jars — so sandstone is the sandstone in this world and not a guess at it.
 * (The extractor lives in scratch, not here; only its output ships, because the page must stay a
 * single self-contained file with no build step and no network.)
 *
 * Substring rather than exact match because the index carries fully-qualified names
 * ("minecraft:coarse_dirt") and mod blocks arrive with prefixes nobody has enumerated. A table of
 * exact names would silently grey out every block the pack adds.
 *
 * Ores come first so that "deepslate_iron_ore" is iron and not deepslate — the ore is the entire
 * reason anyone is looking at that cell.
 *
 *   c    body colour
 *   m    material class, which is what actually gets drawn (see MAT below)
 *   h    ore halo — see ORE HALOS
 */
const PALETTE = [
  // ── ores ───────────────────────────────────────────────────────────────
  //
  // ORE HALOS. `c` is the mineral's own colour, which for coal is black and for copper is a drab
  // olive — accurate, and useless from thirty blocks away. `h` is the same mineral pushed to a
  // brightness that survives distance and fog, and it is what the glow shell is drawn in. Without
  // it "find the ore" degrades to "find the slightly different grey", which is the failure this
  // whole table exists to prevent.
  [/diamond_ore/,            { c: 0x62ede4, m: 'ore', h: 0x7dfff4 }],
  [/emerald_ore/,            { c: 0x2acb58, m: 'ore', h: 0x4cff86 }],
  [/gold_ore/,               { c: 0xf6d03e, m: 'ore', h: 0xffe063 }],
  [/redstone_ore/,           { c: 0xb01905, m: 'ore', h: 0xff3b2f }],
  [/lapis_ore/,              { c: 0x1f438c, m: 'ore', h: 0x4f8bff }],
  [/platinum_ore/,           { c: 0x96b4bf, m: 'ore', h: 0xc2e6f2 }],
  [/copper_ore/,             { c: 0xc06c50, m: 'ore', h: 0xff9463 }],
  [/iron_ore/,               { c: 0xa6886b, m: 'ore', h: 0xe6bd8f }],
  [/zinc_ore/,               { c: 0x969f95, m: 'ore', h: 0xd8e8b0 }],
  [/coal_ore/,               { c: 0x1e1f24, m: 'ore', h: 0x7d879c }],
  [/quartz_ore/,             { c: 0xefe7dc, m: 'ore', h: 0xfff8ec }],
  [/ancient_debris/,         { c: 0x604038, m: 'ore', h: 0xc08a63 }],
  // An ore type nobody enumerated is still an ore, and a loud unassigned magenta is the right
  // answer: it is visible, it is obviously not a rock, and it asks to be added to this table.
  [/_ore(\b|_)/,             { c: 0xff5fd0, m: 'ore', h: 0xff9ce4 }],

  // ── the fleet's own hardware ───────────────────────────────────────────
  // Every computercraft block reads as one thing — infrastructure — because that is the only
  // distinction that matters on this map. A modem and a disk drive are both "we built that".
  // Same off-white the computer pillars and the legend already use, so the two agree.
  [/^computercraft:|^peripheralworks:/, { c: 0xdfe6ee, m: 'lume' }],

  // ── liquids and light ──────────────────────────────────────────────────
  // water_still.png is greyscale and tinted per biome at render time, so the texture mean is a
  // meaningless 0xb1b1b1; this is vanilla's default water tint. Drawn translucent because you
  // need to see the cave floor under it.
  [/water/,                  { c: 0x3f76e4, m: 'liquid' }],
  [/lava/,                   { c: 0xd9691a, m: 'lume' }],
  [/magma/,                  { c: 0x8e3f1f, m: 'lume' }],
  [/glowstone|sea_lantern|shroomlight|torch|lantern|campfire/, { c: 0xffd28a, m: 'lume' }],
  [/glow_lichen/,            { c: 0x86a179, m: 'lume' }],

  // ── rock ───────────────────────────────────────────────────────────────
  [/bedrock/,                { c: 0x555555 }],
  [/smooth_basalt/,          { c: 0x49484e }],
  [/basalt/,                 { c: 0x49494e }],
  [/blackstone/,             { c: 0x2a2429 }],
  [/deepslate/,              { c: 0x505053 }],
  [/cobblestone/,            { c: 0x807f80 }],
  [/granite/,                { c: 0x956756 }],
  [/andesite/,               { c: 0x888889 }],
  [/diorite/,                { c: 0xbdbcbd }],
  [/calcite/,                { c: 0xdfe0dd }],
  [/dripstone/,              { c: 0x866c5d }],
  [/tuff/,                   { c: 0x6c6d67 }],
  [/obsidian/,               { c: 0x0f0b19 }],
  [/netherrack/,             { c: 0x622626 }],
  [/amethyst/,               { c: 0x8662bf }],
  [/furnace|blast_furnace|smoker/, { c: 0x6b6a6a }],

  // ── ground ─────────────────────────────────────────────────────────────
  [/red_sandstone/,          { c: 0xbb631d }],
  [/sandstone/,              { c: 0xd8cb9c }],
  [/red_sand/,               { c: 0xbf6721 }],
  [/sand/,                   { c: 0xdbcfa3 }],
  [/gravel/,                 { c: 0x847f7f }],
  [/clay/,                   { c: 0xa1a6b3 }],
  [/coarse_dirt/,            { c: 0x77563b }],
  [/rooted_dirt/,            { c: 0x90684d }],
  [/podzol/,                 { c: 0x5c3f18 }],
  [/mud/,                    { c: 0x3c393d }],
  [/dirt/,                   { c: 0x866043 }],
  [/grass_block/,            { c: 0x5c8a34 }],
  [/moss/,                   { c: 0x596e2d }],
  [/terracotta/,             { c: 0x985e44 }],
  [/packed_ice|blue_ice/,    { c: 0x8eb4fa }],
  [/ice/,                    { c: 0x92b8fe }],
  [/snow/,                   { c: 0xf9fefe }],

  // ── vegetation and build ───────────────────────────────────────────────
  [/cactus/,                 { c: 0x59822d }],
  [/dead_bush/,              { c: 0x6b4f29 }],
  [/leaves/,                 { c: 0x4a6b28 }],
  [/spruce_log|dark_oak_log/, { c: 0x3b2611 }],
  [/log|wood|stem/,          { c: 0x6d5533 }],
  [/planks/,                 { c: 0xa2834f }],
  [/crafting_table|barrel|bookshelf/, { c: 0x816a46 }],
  [/chest|shulker/,          { c: 0x694e23 }],
  [/glass/,                  { c: 0xb0d6db, m: 'liquid' }],
  [/iron_block/,             { c: 0xdcdcdc }],
  [/gold_block/,             { c: 0xf6d03e }],
  [/diamond_block/,          { c: 0x62ede4 }],
  [/copper_block|cut_copper/, { c: 0xc06c50 }],
  [/wool|concrete/,          { c: 0xc9ced6 }],

  // DEAD LAST, and that placement is the rule. "sandstone" contains "stone"; so do
  // "mossy_cobblestone", "blackstone" and "sandstone_stairs". A plain-stone rule sitting anywhere
  // above them turns half the desert grey, which is exactly the bug this table was written to end.
  [/stone/,                  { c: 0x7e7e7e }],
];

/**
 * NAMED BUT NOT IN THE TABLE is a third state, and it gets its own colour.
 *
 * A mod block we have never seen is not "unidentified" — the fleet told us exactly what it is and
 * this table came up short. Drawing it as unknown terrain would hide our own gap; drawing it in a
 * colour nothing else uses makes the gap visible in the legend, by name, so it can be fixed.
 */
const UNLISTED = { c: 0x8f7fa8 };

/**
 * SOLID BUT UNIDENTIFIED. Not air — the block index is a strict subset of the occupancy grid, and
 * a missing key means "we know something is here, we do not know what".
 *
 * Deliberately a slate blue-violet that no real block in the table occupies, so the eye never has
 * to decide whether a grey cell is stone or ignorance. The index currently covers a few per cent
 * of surveyed cells; a neutral grey here would quietly imply the map is far more complete than it
 * is.
 */
const UNKNOWN_COLOR = 0x4d5a72;

const paletteCache = new Map();
function blockStyle(name) {
  let hit = paletteCache.get(name);
  if (hit !== undefined) return hit;
  hit = UNLISTED;
  for (const [re, style] of PALETTE) if (re.test(name)) { hit = style; break; }
  paletteCache.set(name, hit);
  return hit;
}

/** Short, human name for the legend: "minecraft:deepslate_copper_ore" -> "deepslate copper ore". */
const shortName = (n) => n.replace(/^[a-z0-9_]+:/, '').replace(/_/g, ' ');

// ── terrain ────────────────────────────────────────────────────────────────

const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

/**
 * Highest solid cell per column, keyed "x,z".
 *
 * Kept because a drone's altitude is only meaningful against the ground under it. This is what
 * turns "D3 is at y=117" — a number nobody can judge — into "D3 is 40 blocks above the terrain it
 * was sent to survey", which is a diagnosis.
 */
let surfaceAt = new Map();

/**
 * MATERIAL CLASSES, and why there are only four.
 *
 * ~180,000 cells. One material per block type would be hundreds of draw calls and a rebuild that
 * stalls the tab; one material for everything cannot say "this one is ore". So the split is by
 * BEHAVIOUR — how the surface responds to light — and the block's own colour rides along as a
 * per-instance attribute inside its class. Four materials, four draw calls, every block its own
 * colour.
 *
 *   solid   plain lit rock. The bulk of the world.
 *   ore     lifted off the shading curve so an ore in shadow still reads as ore and not as a
 *           dark patch of stone. The lift is white and small; the hue stays the mineral's.
 *   lume    things that emit in the real world — lava, glowstone, our own computers.
 *   liquid  see-through, and never writes depth, so what is under the water still draws.
 */
const MAT = {
  solid:  () => new THREE.MeshLambertMaterial(),
  ore:    () => new THREE.MeshLambertMaterial({ emissive: 0xffffff, emissiveIntensity: 0.16 }),
  lume:   () => new THREE.MeshLambertMaterial({ emissive: 0xffffff, emissiveIntensity: 0.34 }),
  liquid: () => new THREE.MeshLambertMaterial({ transparent: true, opacity: 0.45, depthWrite: false }),
};

/** Rock opacity while x-ray is on. Low enough to see an ore seam three chunks in. */
const XRAY_OPACITY = 0.22;

/** What the legend is built from: block name -> {count, style}, freshest terrain build wins. */
let blockTally = new Map();

function buildTerrain(cells, bounds, blockAt) {
  clearGroup(gTerrain);
  clearGroup(gAir);
  surfaceAt = new Map();
  blockTally = new Map();
  if (!bounds) return null;

  // One list per material class, plus ore kept apart because it also gets a halo. Flat number
  // arrays rather than arrays-of-arrays: at this cell count the per-tuple object headers are the
  // difference between a rebuild you do not notice and one that visibly hitches the tab.
  const buckets = { solid: [], ore: [], lume: [], liquid: [] };
  const air = [];      // flat x,y,z
  const frame = [];    // flat x,y,z of everything drawn, for the camera framing box
  let identified = 0, drawn = 0, oreCount = 0;

  for (const k in cells) {
    const v = cells[k];
    const p = k.split(':');
    const x = +p[0], y = +p[1], z = +p[2];
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
    if (v !== 1) { air.push(x, y, z); continue; }

    const col = x + ',' + z;
    const prev = surfaceAt.get(col);
    if (prev === undefined || y > prev) surfaceAt.set(col, y);

    // ABSENT IS NOT AIR AND MISSING IS NOT AIR. `blockAt` is a strict subset of `cells`; a key it
    // does not carry is a solid cell of unknown type, so it is drawn, in the unknown colour.
    const name = blockAt?.[k];
    const style = name ? blockStyle(name) : null;

    // A cell whose six neighbours are all solid can never be seen. 2 (drone-occupied) and
    // absent both count as open, so anything not known-solid can expose a face.
    const buried =
      cells[(x + 1) + ':' + y + ':' + z] === 1 && cells[(x - 1) + ':' + y + ':' + z] === 1 &&
      cells[x + ':' + (y + 1) + ':' + z] === 1 && cells[x + ':' + (y - 1) + ':' + z] === 1 &&
      cells[x + ':' + y + ':' + (z + 1)] === 1 && cells[x + ':' + y + ':' + (z - 1)] === 1;

    // ORE IS NEVER CULLED. Ore is by definition surrounded by rock, so the buried test — correct
    // for terrain, where an invisible cube is wasted GPU — deleted precisely the blocks this map
    // exists to show. Every ore cell is drawn whether it can be seen or not; the x-ray and the
    // halo are what make it visible, and there are only ever a few thousand of them.
    const isOre = style?.m === 'ore';
    if (buried && !isOre) continue;

    // Counted AFTER the cull, all three of them, because the HUD says "N of M drawn" and the
    // legend is a key to what is on screen. Tallying culled cells made it read "121409 of 21860",
    // which is not a ratio of anything.
    drawn++;
    if (style) identified++;
    if (isOre) oreCount++;
    if (name) blockTally.set(name, (blockTally.get(name) ?? 0) + 1);
    const cls = style?.m ?? 'solid';
    // The height shade applies to UNKNOWN cells only, and only faintly. It is one colour, not a
    // gradient of many: without some relief a 130,000-cube slab of a single flat colour loses all
    // shape, and with too much it starts to look like data we do not have.
    const shade = style ? 1 : 0.82 + 0.30 * ((y - bounds.min.y) / Math.max(1, bounds.max.y - bounds.min.y));
    buckets[cls].push(x, y, z, (style ? style.c : UNKNOWN_COLOR), shade, isOre ? style.h : 0);
    frame.push(x, y, z);
  }

  for (const cls in buckets) if (buckets[cls].length) addInstances(cls, buckets[cls]);

  gTerrain.userData.identified = identified;
  gTerrain.userData.drawn = drawn;
  gTerrain.userData.ore = oreCount;
  applyXray($('t-xray').checked);
  renderBlockLegend();

  if (air.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(Float32Array.from(air), 3));
    gAir.add(new THREE.Points(geo, new THREE.PointsMaterial({
      color: 0x4b6fa0, size: 0.16, transparent: true, opacity: 0.55, sizeAttenuation: true,
    })));
  }

  return percentileBox(frame.length ? frame : air) ?? bounds;
}

/**
 * One InstancedMesh for a whole material class, coloured per instance.
 *
 * `data` is flat groups of six: x, y, z, colour, shade, halo. Ore additionally gets a second,
 * larger, additively-blended shell drawn in the halo colour with depth testing OFF — which is the
 * one thing on this page that lets you see a seam that is entirely inside rock. Additive means it
 * only ever brightens, so overlapping seams read as a stronger glow rather than a flat blob, and
 * with depthWrite off there is no sorting to get wrong.
 */
function addInstances(cls, data) {
  const n = data.length / 6;
  const mesh = new THREE.InstancedMesh(CUBE, MAT[cls](), n);
  // NOT `vertexColors: true`. That define makes the shader multiply by a per-VERTEX `color`
  // attribute, which BoxGeometry does not have, so every instance came out multiplied by zero —
  // a terrain of black cubes on a black background, indistinguishable from a failed load.
  // Per-INSTANCE colour is a different define and setColorAt turns it on by itself.
  for (let i = 0; i < n; i++) {
    const o = i * 6;
    dummy.position.set(data[o], data[o + 1], data[o + 2]);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    tmpColor.setHex(data[o + 3]).multiplyScalar(data[o + 4]);
    mesh.setColorAt(i, tmpColor);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.userData.cls = cls;
  gTerrain.add(mesh);

  if (cls !== 'ore') return;
  const halo = new THREE.InstancedMesh(CUBE, new THREE.MeshBasicMaterial({
    transparent: true, opacity: 0.34, blending: THREE.AdditiveBlending,
    depthWrite: false, depthTest: false,
  }), n);
  for (let i = 0; i < n; i++) {
    const o = i * 6;
    dummy.position.set(data[o], data[o + 1], data[o + 2]);
    dummy.scale.setScalar(1.55);
    dummy.updateMatrix();
    dummy.scale.setScalar(1);
    halo.setMatrixAt(i, dummy.matrix);
    tmpColor.setHex(data[o + 5]);
    halo.setColorAt(i, tmpColor);
  }
  halo.instanceMatrix.needsUpdate = true;
  if (halo.instanceColor) halo.instanceColor.needsUpdate = true;
  // Behind the labels, in front of the terrain. Without an explicit order a depth-testless mesh
  // lands wherever the sort happens to put it and flickers as the camera moves.
  halo.renderOrder = 4;
  halo.userData.cls = 'halo';
  gTerrain.add(halo);
}

/**
 * X-RAY: make the rock see-through so buried ore is findable.
 *
 * Ore halos ignore depth all the time, so a seam is always at least a hint. X-ray is for when the
 * hint is not enough and you want to see WHERE in the rock it sits — the surrounding terrain drops
 * to a fifth opacity and the ore cores themselves come through. Off by default because a
 * transparent world is the wrong default for "why did the drone stop there".
 */
function applyXray(on) {
  for (const m of gTerrain.children) {
    const cls = m.userData.cls;
    if (cls === 'halo' || cls === 'ore' || cls === 'liquid') continue;
    const mat = m.material;
    mat.transparent = !!on;
    mat.opacity = on ? XRAY_OPACITY : 1;
    mat.depthWrite = !on;
    mat.needsUpdate = true;
  }
}

/**
 * The box worth pointing a camera at — NOT the full bounding box.
 *
 * The survey has a long tail: one scout wandered to z -114 while every other cell sits between
 * -38 and -60, and framing on the extremes makes the part anyone cares about a smudge. Clipping
 * to the 3rd..97th percentile per axis throws away the strays and keeps the base.
 *
 * `points` is flat x,y,z triples.
 */
function percentileBox(points, lo = 0.03, hi = 0.97) {
  if (!points.length) return null;
  const at = (i) => {
    const v = [];
    for (let j = i; j < points.length; j += 3) v.push(points[j]);
    v.sort((a, b) => a - b);
    return [v[Math.floor((v.length - 1) * lo)], v[Math.ceil((v.length - 1) * hi)]];
  };
  const [x0, x1] = at(0), [y0, y1] = at(1), [z0, z1] = at(2);
  return { min: { x: x0, y: y0, z: z0 }, max: { x: x1, y: y1, z: z1 } };
}

/**
 * The colour key, built from what is actually on screen rather than from the table.
 *
 * A static legend of forty block types would be mostly rows for blocks this world does not
 * contain, and the reader would have to scan past them to find the four that matter. This lists
 * exactly what was drawn, ore first and always in full — a single diamond block is the most
 * important row on the page and must never be crowded out by ten thousand sandstone.
 */
function renderBlockLegend() {
  const el = $('legend-blocks');
  const entries = [...blockTally].sort((a, b) => b[1] - a[1]);
  const ore = entries.filter(([n]) => blockStyle(n).m === 'ore');
  const rest = entries.filter(([n]) => blockStyle(n).m !== 'ore').slice(0, 10);
  const unknown = (gTerrain.userData.drawn ?? 0) - (gTerrain.userData.identified ?? 0);

  const row = ([n, c]) => {
    const s = blockStyle(n);
    return `<span title="${esc(n)} — ${c}"><i class="swatch" style="background:${hexOf(s.m === 'ore' ? s.h : s.c)}${s.m === 'ore' ? ';box-shadow:0 0 6px ' + hexOf(s.h) : ''}"></i>${esc(shortName(n))}</span>`;
  };

  el.innerHTML =
    (ore.length ? `<div class="lg-h">ore · ${ore.reduce((a, e) => a + e[1], 0)} blocks</div>
                   <div class="lg">${ore.map(row).join('')}</div>` : '')
    + (rest.length ? `<div class="lg-h">terrain</div><div class="lg">${rest.map(row).join('')}</div>` : '')
    + `<div class="lg">
         <span title="solid, but the block index does not say what"><i class="swatch"
           style="background:${hexOf(UNKNOWN_COLOR)}"></i>unidentified${unknown > 0 ? ' · ' + unknown : ''}</span>
       </div>`
    + (entries.length ? '' : '<div class="muted">no block identities yet</div>');
  el.className = '';
}

/** Ground level under a position, searching outward a little so a drone over a gap still gets one. */
function groundUnder(x, z) {
  const exact = surfaceAt.get(Math.round(x) + ',' + Math.round(z));
  if (exact !== undefined) return exact;
  let best;
  for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
    const v = surfaceAt.get((Math.round(x) + dx) + ',' + (Math.round(z) + dz));
    if (v !== undefined && (best === undefined || v > best)) best = v;
  }
  return best;
}

// ── boxes: caves and task regions ──────────────────────────────────────────

/**
 * A translucent box over an inclusive block range.
 *
 * min..max covers max-min+1 cells and each cell is drawn centred on its own coordinate, so the
 * box centre sits at the midpoint of the two extremes, not half a block past it. The wireframe is
 * what actually reads at distance; the fill only gives it volume.
 */
function addBox(group, min, max, color, opacity = 0.1, dashed = false) {
  const w = max.x - min.x + 1, h = max.y - min.y + 1, d = max.z - min.z + 1;
  const geo = new THREE.BoxGeometry(w, h, d);
  const cx = (min.x + max.x) / 2, cy = (min.y + max.y) / 2, cz = (min.z + max.z) / 2;

  const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity, depthWrite: false, side: THREE.BackSide,
  }));
  fill.position.set(cx, cy, cz);
  group.add(fill);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: dashed ? 0.3 : 0.7 }),
  );
  edges.position.set(cx, cy, cz);
  group.add(edges);
  return { x: cx, y: cy, z: cz };
}

function buildCaves(caves) {
  clearGroup(gCaves);
  for (const c of caves) addBox(gCaves, c.min, c.max, 0xa06bd8, 0.09);
}

// ── task regions: what the fleet was TOLD to do ────────────────────────────

let taskAnchors = new Map();   // drone name -> region centre, for the assignment lines

function buildTasks(tasks, dronesByName) {
  clearGroup(gTasks);
  taskAnchors = new Map();
  const showLabels = $('t-labels').checked;

  for (const t of tasks) {
    if (!t.region) continue;         // queued work whose geometry TaskMan does not yet report
    const color = VERB_COLOR[t.verb] ?? 0x9aa6b4;
    const active = !!t.assigned && !t.paused;
    // Queued work is drawn faintly and unfilled. An operator needs to tell at a glance which boxes
    // are being worked from which are merely waiting, or the map implies a fleet five times busier
    // than it is.
    const centre = addBox(gTasks, t.region.min, t.region.max, color,
                          active ? 0.11 : 0.03, !active);

    if (showLabels) {
      const pct = t.progress ? ` ${Math.round(t.progress * (t.progress <= 1 ? 100 : 1))}%` : '';
      const label = makeLabel(`${t.verb ?? 'task'} ${t.name}${pct}`, '#' + color.toString(16).padStart(6, '0'));
      label.position.set(centre.x, t.region.max.y + 2.2, centre.z);
      label.userData.isLabel = true;
      gTasks.add(label);
    }

    // The link between a drone and its work. TaskMan does not publish the route a drone is
    // actually taking — pgps computes and holds that on the turtle itself — so this is drawn as a
    // straight assignment line and not as a path. Pretending to know the route would be inventing
    // data, and a wrong path on a map is worse than none.
    for (const name of String(t.assigned ?? '').split(',').map((s) => s.trim()).filter(Boolean)) {
      taskAnchors.set(name, { centre, color, task: t });
      const d = dronesByName.get(name);
      if (!d?.pos) continue;
      gTasks.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(d.pos.x, d.pos.y, d.pos.z),
          new THREE.Vector3(centre.x, centre.y, centre.z),
        ]),
        new THREE.LineDashedMaterial({ color, transparent: true, opacity: 0.55,
                                       dashSize: 1.6, gapSize: 1.2 }),
      ).computeLineDistances());
    }
  }
}

// ── computers ──────────────────────────────────────────────────────────────

function buildNodes(nodes) {
  clearGroup(gNodes);
  const showLabels = $('t-labels').checked;
  for (const n of nodes) {
    if (!n.pos) continue;            // unknown position: listed in the panel, not guessed onto the map
    const color = n.reachable ? (n.faults ? 0xf0b45e : 0xdfe6ee) : 0xf2616b;
    // A tall thin pillar, deliberately unlike anything else in the scene: computers are fixed
    // infrastructure and should not be mistakable for a drone or a block at a glance.
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 2.2, 6),
      new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: n.reachable ? 0.45 : 0.2 }),
    );
    body.position.set(n.pos.x, n.pos.y + 0.6, n.pos.z);
    gNodes.add(body);

    if (showLabels) {
      const label = makeLabel(`${n.module}${n.faults ? ' !' + n.faults : ''}`,
                              '#' + color.toString(16).padStart(6, '0'));
      label.position.set(n.pos.x, n.pos.y + 3.4, n.pos.z);
      label.userData.isLabel = true;
      gNodes.add(label);
    }
  }
}

// ── materials ──────────────────────────────────────────────────────────────

/**
 * Ore and dirt markers, drawn as hollow cages rather than solid cubes.
 *
 * That is a deliberate statement about trust. These come from the block index, which is known to
 * prune positions that are still physically in the world — four coal blocks that exist were
 * removed from it. A solid block on a map reads as fact; a cage reads as an annotation, which is
 * what an advisory index entry actually is.
 */
function buildMaterials(groups) {
  clearGroup(gMats);
  for (const { hits, color } of groups) {
    if (!hits.length) continue;
    const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.12, 1.12, 1.12));
    for (const h of hits) {
      const cage = new THREE.LineSegments(geo.clone(),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9 }));
      cage.position.set(h.x, h.y, h.z);
      gMats.add(cage);
    }
    geo.dispose();
  }
}

// ── drones ─────────────────────────────────────────────────────────────────

function makeLabel(text, hex) {
  const c = document.createElement('canvas');
  let g = c.getContext('2d');
  const font = 'bold 40px ui-monospace, Menlo, monospace';
  g.font = font;
  const w = Math.ceil(g.measureText(text).width) + 26;
  c.width = w; c.height = 58;
  g = c.getContext('2d');            // resizing a canvas resets its context, so re-fetch and re-set
  g.font = font;
  g.fillStyle = 'rgba(8,12,18,0.82)';
  g.fillRect(0, 0, w, 58);
  g.strokeStyle = hex; g.lineWidth = 3; g.strokeRect(1.5, 1.5, w - 3, 55);
  g.fillStyle = hex; g.textBaseline = 'middle';
  g.fillText(text, 13, 30);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthTest: false,
  }));
  sprite.scale.set((w / 58) * 2.4, 2.4, 1);
  sprite.renderOrder = 999;          // labels are navigation aids; never let terrain swallow them
  return sprite;
}

const droneMeshes = [];              // raycast targets, rebuilt with the group

function buildDrones(drones) {
  clearGroup(gDrones);
  droneMeshes.length = 0;
  const showLabels = $('t-labels').checked;
  // Where labels have already been put, so parked drones do not stack their names into one
  // unreadable blur. D4 and D5 sit one block apart at the dock; that is the normal case.
  const placed = [];

  for (const d of drones) {
    if (!d.pos) continue;            // a drone with no fix cannot be placed, and guessing is worse
    const offline = DEAD.has(d.status) || DEAD.has(doingOf(d) ?? '');
    const color = offline ? OFFLINE_COLOR : (ROLE_COLOR[d.role] ?? 0xffffff);

    const body = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.85),
      new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: offline ? 0.15 : 0.6 }),
    );
    body.position.set(d.pos.x, d.pos.y, d.pos.z);
    body.userData.drone = d;
    gDrones.add(body);
    droneMeshes.push(body);

    // A stalk down to the ground under it. Two jobs: it keeps a drone inside the terrain findable,
    // and its LENGTH is the altitude cue — a scout that has ratcheted itself into the sky trails a
    // stalk the height of the screen, which is not a thing you can fail to notice.
    const ground = groundUnder(d.pos.x, d.pos.z);
    const above = ground === undefined ? null : d.pos.y - ground;
    d.aboveGround = above;
    const high = above !== null && above > HIGH_ABOVE_GROUND;
    const foot = ground === undefined ? d.pos.y - 14 : ground;
    gDrones.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(d.pos.x, d.pos.y - 0.9, d.pos.z),
        new THREE.Vector3(d.pos.x, foot, d.pos.z),
      ]),
      new THREE.LineBasicMaterial({ color: high ? 0xf2616b : color,
                                    transparent: true, opacity: high ? 0.85 : 0.28 }),
    ));

    if (showLabels) {
      const rep = doingOf(d);
      const doing = rep && rep !== d.status ? rep : d.status;
      const anchor = taskAnchors.get(d.name);
      const job = anchor ? ` → ${anchor.task.verb ?? anchor.task.name}` : '';
      const alt = high ? ` +${above}↑` : '';
      const label = makeLabel(`${d.name} ${doing}${job}${alt}`,
                              '#' + (high ? 0xf2616b : color).toString(16).padStart(6, '0'));
      let ly = d.pos.y + 2.4;
      while (placed.some((p) => Math.abs(p.x - d.pos.x) < 7 && Math.abs(p.z - d.pos.z) < 7 &&
                                Math.abs(p.y - ly) < 2.5)) ly += 2.6;
      placed.push({ x: d.pos.x, y: ly, z: d.pos.z });
      label.position.set(d.pos.x, ly, d.pos.z);
      label.userData.isLabel = true;
      gDrones.add(label);
    }
  }
}

// ── camera framing ─────────────────────────────────────────────────────────

let framed = false;

/**
 * Point the camera at the DATA, once.
 *
 * The base sits around x -60..-100, z -40..-60. A camera left at the origin looks at empty desert
 * a hundred blocks away and the page appears broken. Framing happens once and never again:
 * re-framing on every poll would yank the view out from under anyone mid-inspection.
 */
function frameOnce(bounds) {
  if (framed || !bounds) return;
  framed = true;
  const cx = (bounds.min.x + bounds.max.x) / 2;
  const cy = (bounds.min.y + bounds.max.y) / 2;
  const cz = (bounds.min.z + bounds.max.z) / 2;
  const span = Math.max(bounds.max.x - bounds.min.x, bounds.max.y - bounds.min.y,
                        bounds.max.z - bounds.min.z, 16);
  // Solve for the distance that actually fits `span` in the frustum rather than guessing a
  // multiple of it. Guessing put the camera about twice as far out as needed.
  const dist = (span / 2) / Math.tan((camera.fov * Math.PI) / 360) * 1.3;

  controls.target.set(cx, cy, cz);
  camera.position.set(cx, cy, cz)
        .addScaledVector(new THREE.Vector3(0.62, 0.52, 0.86).normalize(), dist);
  camera.far = dist * 30;
  camera.updateProjectionMatrix();
  scene.fog.near = dist * 0.85;
  scene.fog.far = dist * 3.2;
  controls.update();
}

function flyTo(pos) {
  controls.target.set(pos.x, pos.y, pos.z);
  controls.update();
}

// ── polling ────────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
const errBox = $('err');
const problem = (msg) => { errBox.textContent = msg; errBox.style.display = msg ? 'block' : 'none'; };

/** Unwrap the registry envelope. ok:false is data too — it says which panel to mark unavailable. */
const dataOf = (env) => (env && env.ok ? env.data : null);
const esc = (s) => String(s ?? '').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const hexOf = (n) => '#' + n.toString(16).padStart(6, '0');

/**
 * Silence, in words.
 *
 * fleet.status returns `silentMs`; hive.brief returns the same fact as `silentSec`. This page
 * reads the former, and asking for the latter is how the first version of this panel reported
 * every healthy drone as "never reported" — undefined is not null, but `== null` catches both, so
 * the wrong field name failed as a plausible-looking sentence rather than as an error.
 */
const silentText = (d) =>
  d.silentMs == null ? 'never reported' : `silent ${Math.round(d.silentMs / 1000)}s`;
/** The drone's own word for what it is doing, which fleet.status calls `reported`. */
const doingOf = (d) => d.reported ?? d.doing ?? null;

let lastStateAt = 0;
let lastDrones = [];
let lastTasks = [];
/** Last known bridge state, so the terrain poll can tell 'down' from 'genuinely broken'. */
let bridgeUp = null;

/**
 * Skip a tick rather than stack one. Each /map/state poll fans out to several in-world calls, and
 * rednet round-trips can take seconds — longer than the poll interval. A dropped tick costs three
 * seconds of freshness; a pile-up costs the fleet its command channel.
 */
function guarded(fn) {
  let running = false;
  return async () => {
    if (running) return;
    running = true;
    try { await fn(); } finally { running = false; }
  };
}

/**
 * The last block index that actually arrived, and when.
 *
 * MapServer.BlockAt times out often — roughly one poll in three at the moment. Rebuilding the
 * terrain from a failed call repaints the whole world back to unidentified grey, so the map
 * strobes between "here is your sandstone and three iron seams" and "we know nothing", every
 * fifteen seconds, for a reason that has nothing to do with the world.
 *
 * Identity is not volatile — a block that was sandstone a minute ago still is. So the last good
 * index is kept and reused, and the HUD says how old it is. Stale-and-labelled beats blank.
 */
let lastBlockAt = null;
let blockAtAt = 0;

async function pollVoxels() {
  // Say "loading" while the first fetch is in flight. A cold LoadWorld is a rednet round-trip over
  // a grid of several thousand cells and can take fifteen seconds; leaving the field as an ellipsis
  // that whole time is indistinguishable from the page having quietly given up.
  if (!framed) $('h-cells').textContent = 'loading…';
  try {
    const r = await (await fetch('/map/voxels', { cache: 'no-store' })).json();
    const v = dataOf(r.voxels);
    if (!v) throw new Error(r.voxels?.error ?? 'world.voxels returned nothing');
    // Identity is optional. world.blocks needs a MapServer that has been synced with the BlockAt
    // endpoint; until then the terrain renders unidentified rather than not at all.
    const b = dataOf(r.blocks);
    if (b?.blockAt) { lastBlockAt = b.blockAt; blockAtAt = Date.now(); }
    const stale = !b?.blockAt && lastBlockAt;
    const focus = buildTerrain(v.cells ?? {}, v.bounds, b?.blockAt ?? lastBlockAt);
    frameOnce(focus ?? v.bounds);
    $('h-cells').textContent = `${v.solid} solid / ${v.known} known`;
    const age = Math.round((Date.now() - blockAtAt) / 1000);
    $('h-ident').textContent = !lastBlockAt ? 'not available'
      : `${gTerrain.userData.identified ?? 0} of ${gTerrain.userData.drawn ?? 0} drawn`
        + (stale ? ` · ${age}s old` : '');
    $('h-ident').style.color = !lastBlockAt || stale ? 'var(--warn)' : '';
    const ore = gTerrain.userData.ore ?? 0;
    $('h-ore').textContent = lastBlockAt ? `${ore} block${ore === 1 ? '' : 's'}` : 'not available';
    $('h-ore').style.color = !lastBlockAt ? 'var(--warn)' : (ore ? '#ffe14d' : '');
  } catch (err) {
    $('h-cells').textContent = 'unavailable';
    // A bridge that is down is already reported once, in the HUD, by the state poll. Repeating it
    // as a red banner would train the operator to ignore the banner during every fleet reload —
    // which is exactly when a genuinely different error most needs to be readable.
    if (bridgeUp !== false) problem(`terrain: ${err.message}`);
  }
}

async function pollState() {
  let s;
  try {
    s = await (await fetch('/map/state', { cache: 'no-store' })).json();
  } catch (err) {
    problem(`HQ unreachable: ${err.message}`);
    $('h-bridge').innerHTML = `<span class="dot" style="background:var(--bad)"></span>no HQ`;
    return;
  }
  problem('');
  lastStateAt = Date.now();

  const up = s.bridge?.connected;
  bridgeUp = !!up;
  $('h-bridge').innerHTML =
    `<span class="dot" style="background:${up ? 'var(--ok)' : 'var(--bad)'}"></span>` +
    (up ? `connected · ${s.bridge.inFlight} in flight` : 'disconnected');

  // Fleet ------------------------------------------------------------------
  const fleet = dataOf(s.fleet);
  const drones = fleet?.drones ?? [];
  lastDrones = drones;
  const byName = new Map(drones.map((d) => [d.name, d]));
  $('h-drones').textContent = fleet
    ? `${drones.length} · ${drones.filter((d) => d.status === 'idle').length} idle`
    : 'unavailable';

  // Tasks ------------------------------------------------------------------
  const tasks = dataOf(s.tasks)?.tasks ?? [];
  lastTasks = tasks;
  const staffed = tasks.filter((t) => t.assigned).length;
  $('h-tasks').textContent = dataOf(s.tasks) ? `${tasks.length} · ${staffed} staffed` : 'unavailable';
  buildTasks(tasks, byName);
  // Drones after tasks: their labels name the job, which comes from the anchors tasks just built.
  buildDrones(drones);
  renderFleet(drones, s.fleet);
  renderTasks(tasks, s.tasks);

  // Computers --------------------------------------------------------------
  const nodesEnv = dataOf(s.nodes);
  const nodes = nodesEnv?.nodes ?? [];
  $('h-nodes').textContent = !nodesEnv ? 'unavailable'
    : nodesEnv.probing ? 'probing…' : `${nodesEnv.up} of ${nodesEnv.count} up`;
  $('h-nodes').style.color = nodesEnv && nodesEnv.up < nodesEnv.count ? 'var(--warn)' : '';
  buildNodes(nodes);
  renderNodes(nodes, nodesEnv?.note);

  // Caves ------------------------------------------------------------------
  const caves = dataOf(s.caves)?.caves ?? [];
  $('h-caves').textContent = dataOf(s.caves) ? String(caves.length) : 'unavailable';
  buildCaves(caves);

  // Materials --------------------------------------------------------------
  const ore = dataOf(s.ore)?.hits ?? [];
  const dirt = dataOf(s.dirt)?.hits ?? [];
  buildMaterials([{ hits: ore, color: 0xffe14d }, { hits: dirt, color: 0xb07a4a }]);

  // Storage ----------------------------------------------------------------
  const stock = dataOf(s.stock);
  $('h-stock').textContent = stock ? `${stock.kinds} kinds · ${stock.items}` : 'unavailable';
  renderStock(stock);

  renderAlerts(drones, nodes);
}

// ── panels ─────────────────────────────────────────────────────────────────

/**
 * The things that are wrong, stated at the top.
 *
 * Everything else on this page is a view you have to read; this is the part that reads it for you.
 * A drone forty blocks above the ground it is surveying is visible in the 3D view only if you
 * happen to be looking that way.
 */
function renderAlerts(drones, nodes) {
  const out = [];
  for (const d of drones) {
    if (d.aboveGround != null && d.aboveGround > HIGH_ABOVE_GROUND)
      out.push(`${d.name} is ${d.aboveGround} blocks above the surveyed ground — climbing, not surveying?`);
    if (DEAD.has(d.status)) out.push(`${d.name} is ${d.status} (${silentText(d)})`);
    else if (d.fuel < 200) out.push(`${d.name} is low on fuel (${d.fuel})`);
  }
  for (const n of nodes) if (n.reachable && n.faults) out.push(`${n.module}: ${n.faults} fault(s)`);
  $('h-alerts').innerHTML = out.length
    ? `<h2>attention</h2>` + out.map((t) => `<div class="note">${esc(t)}</div>`).join('')
    : '';
}

function renderFleet(drones, env) {
  const el = $('fleet-list');
  if (!drones.length) {
    el.className = 'muted';
    // Name the real reason. "No drones registered" during a fleet reload is technically what HQ
    // knows and entirely the wrong thing to tell an operator, who will go looking for a lost fleet
    // rather than waiting ninety seconds for the bridge to dial back in.
    el.textContent = bridgeUp === false ? 'bridge down — the fleet is unreachable, not gone'
      : env?.ok ? 'no drones registered' : (env?.error ?? 'fleet unavailable');
    return;
  }
  el.className = '';
  el.innerHTML = drones.map((d) => {
    const offline = DEAD.has(d.status);
    const hex = hexOf(offline ? OFFLINE_COLOR : (ROLE_COLOR[d.role] ?? 0xffffff));
    // Turtles cap around 20k fuel, so that is the scale the bar is drawn against.
    const pct = Math.max(2, Math.min(100, Math.round((d.fuel / 20000) * 100)));
    const p = d.pos ? `${d.pos.x}, ${d.pos.y}, ${d.pos.z}` : 'position unknown';
    const anchor = taskAnchors.get(d.name);
    const job = anchor ? `<div class="meta">→ ${esc(anchor.task.verb ?? 'task')} ${esc(anchor.task.name)}</div>` : '';
    const rep = doingOf(d);
    const doing = rep && rep !== d.status ? `${esc(d.status)} · ${esc(rep)}` : esc(d.status);
    const silent = silentText(d);
    const alt = d.aboveGround != null && d.aboveGround > HIGH_ABOVE_GROUND
      ? `<div class="warn">${d.aboveGround} blocks above ground</div>` : '';
    return `<div class="card drone" data-id="${d.id}" style="--accent:${hex}">
      <div class="name" style="color:${hex}">${esc(d.name)} <span class="meta">#${d.id} · ${esc(d.role)}</span></div>
      <div class="meta">${doing} · fuel ${d.fuel.toLocaleString()} · ${silent}</div>
      <div class="pos">${p}</div>${alt}${job}
      <div class="bar"><i style="width:${pct}%;background:${pct < 10 ? 'var(--bad)' : hex}"></i></div>
    </div>`;
  }).join('');

  for (const card of el.querySelectorAll('.drone')) {
    card.addEventListener('click', () => {
      const d = drones.find((x) => String(x.id) === card.dataset.id);
      if (d?.pos) flyTo(d.pos);
    });
  }
}

function renderTasks(tasks, env) {
  const el = $('task-list');
  if (!tasks.length) {
    el.className = 'muted';
    el.textContent = bridgeUp === false ? 'bridge down — queue unreadable'
      : env?.ok ? 'queue empty' : (env?.error ?? 'tasks unavailable');
    return;
  }
  el.className = '';
  // OUTSTANDING WORK FIRST, and only a few finished ones for context.
  //
  // The panel is meant to answer "what is the fleet doing" and was answering "everything it has
  // ever been asked to do". With a long history the single running job was buried under dozens of
  // completed ones, which reads as a fleet that has stopped working.
  const live = tasks.filter((t) => (t.progress ?? 0) < 100);
  const past = tasks.filter((t) => (t.progress ?? 0) >= 100).slice(-6).reverse();
  const shown = live.concat(past);
  const hiddenCount = tasks.length - shown.length;
  const noGeometry = shown.every((t) => !t.region);
  el.innerHTML = shown.map((t) => {
    const hex = hexOf(VERB_COLOR[t.verb] ?? 0x9aa6b4);
    const where = t.region
      ? `${t.region.min.x},${t.region.min.y},${t.region.min.z} → ${t.region.max.x},${t.region.max.y},${t.region.max.z}`
      : 'region not reported';
    const who = t.assigned ? esc(t.assigned) : 'unassigned';
    // A FINISHED TASK IS NOT QUEUED WORK.
    //
    // progress was never consulted, so every task TaskMan had ever completed kept rendering as
    // "queued · unassigned" for ever. Forty-seven finished jobs and one running one displayed as
    // forty-eight things waiting for a drone -- which reads as a fleet that has stopped working,
    // and sent us hunting a scheduler bug that did not exist.
    const finished = (t.progress ?? 0) >= 100;
    const state = finished
      ? (t.failure ? 'failed' : 'done')
      : (t.paused ? 'paused' : (t.enabled === false ? 'disabled' : (t.assigned ? 'running' : 'queued')));
    return `<div class="card task" data-id="${t.id}" style="--accent:${hex}">
      <div class="name" style="color:${hex}">${esc(t.verb ?? 'task')} <span class="meta">${esc(t.name)}</span></div>
      <div class="meta">${state} · ${who}${t.role ? ' · ' + esc(t.role) : ''}</div>
      <div class="pos">${esc(where)}</div>
    </div>`;
  }).join('')
  // Said once, at the bottom, rather than repeated on every card: the reason the boxes are missing
  // is a deploy state, not a per-task fact.
  + (noGeometry ? `<div class="note">No task reports a region. TaskMan.GetTasks only sends
      geometry once the Lua tree is synced and the fleet reloaded; until then this list is
      accurate and the map cannot draw the boxes.</div>` : '');

  for (const card of el.querySelectorAll('.task')) {
    card.addEventListener('click', () => {
      const t = tasks.find((x) => String(x.id) === card.dataset.id);
      if (t?.region) flyTo({ x: (t.region.min.x + t.region.max.x) / 2,
                             y: (t.region.min.y + t.region.max.y) / 2,
                             z: (t.region.min.z + t.region.max.z) / 2 });
    });
  }
}

function renderNodes(nodes, note) {
  const el = $('node-list');
  if (!nodes.length) {
    el.className = 'muted';
    el.textContent = note ?? 'computers unavailable';
    return;
  }
  el.className = '';
  el.innerHTML = nodes.map((n) => {
    const hex = n.reachable ? (n.faults ? '#f0b45e' : '#dfe6ee') : '#f2616b';
    const meta = n.reachable
      ? `up ${n.upSec ?? '?'}s · ${n.faults} fault(s)${n.id != null ? ' · #' + n.id : ''}`
      : 'not answering';
    const where = n.pos ? `${n.pos.x}, ${n.pos.y}, ${n.pos.z}`
                        : (n.reachable ? 'position unknown (no GPS fix)' : '');
    const last = n.monitor || n.log?.[n.log.length - 1];
    return `<div class="card" style="--accent:${hex}">
      <div class="name" style="color:${hex}">${esc(n.module)}</div>
      <div class="meta">${esc(meta)}</div>
      ${where ? `<div class="pos">${esc(where)}</div>` : ''}
      ${last ? `<div class="log">${esc(last)}</div>` : ''}
      ${n.lastFault ? `<div class="warn">${esc(n.lastFault.where)}: ${esc(n.lastFault.err)}</div>` : ''}
    </div>`;
  }).join('') + (note ? `<div class="note">${esc(note)}</div>` : '');
}

function renderStock(stock) {
  const el = $('stock-list');
  if (!stock) { el.className = 'muted'; el.textContent = 'storage unavailable'; return; }
  el.className = '';
  el.innerHTML = (stock.detail ?? []).slice(0, 10).map((it) =>
    `<div class="row"><span class="k">${esc(it.name.replace(/^[a-z]+:/, ''))}</span>` +
    `<span class="v">${it.count}</span></div>`).join('') || '<span class="muted">empty</span>';
}

// ── hover tooltip ──────────────────────────────────────────────────────────

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tip = $('tip');
let hovered = null;

addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;      // the panel is the readout on touch devices
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const d = raycaster.intersectObjects(droneMeshes, false)[0]?.object.userData.drone;

  if (d) {
    const anchor = taskAnchors.get(d.name);
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.innerHTML =
      `<div class="row"><span class="v"><b>${esc(d.name)}</b></span><span class="k">#${d.id}</span></div>` +
      `<div class="row"><span class="k">role</span><span class="v">${esc(d.role)}</span></div>` +
      `<div class="row"><span class="k">status</span><span class="v">${esc(d.status)}${doingOf(d) && doingOf(d) !== d.status ? ' · ' + esc(doingOf(d)) : ''}</span></div>` +
      `<div class="row"><span class="k">fuel</span><span class="v">${d.fuel.toLocaleString()}</span></div>` +
      `<div class="row"><span class="k">at</span><span class="v">${d.pos.x}, ${d.pos.y}, ${d.pos.z}</span></div>` +
      (d.aboveGround != null ? `<div class="row"><span class="k">above ground</span><span class="v">${d.aboveGround}</span></div>` : '') +
      `<div class="row"><span class="k">silent</span><span class="v">${silentText(d)}</span></div>` +
      (anchor ? `<div class="row"><span class="k">job</span><span class="v">${esc(anchor.task.verb ?? anchor.task.name)}</span></div>` : '');
  } else {
    tip.style.display = 'none';
  }

  // Mirror the hover into the side panel so the two views agree on what is selected.
  if (hovered !== d?.id) {
    hovered = d?.id;
    for (const card of document.querySelectorAll('.drone'))
      card.classList.toggle('hot', card.dataset.id === String(hovered));
  }
});

// ── layer toggles ──────────────────────────────────────────────────────────

$('t-solid').onchange = (e) => { gTerrain.visible = e.target.checked; };
// Flips material flags on the meshes already uploaded — no rebuild, so it is instant even at
// 140,000 instances, and the terrain poll does not have to have come back for it to work.
$('t-xray').onchange  = (e) => { applyXray(e.target.checked); };
$('t-air').onchange   = (e) => { gAir.visible = e.target.checked; };
$('t-caves').onchange = (e) => { gCaves.visible = e.target.checked; };
$('t-mats').onchange  = (e) => { gMats.visible = e.target.checked; };
$('t-tasks').onchange = (e) => { gTasks.visible = e.target.checked; };
$('t-nodes').onchange = (e) => { gNodes.visible = e.target.checked; };
$('t-labels').onchange = () => {
  // Labels are built during a refresh rather than toggled, because the text depends on live state.
  // Rebuild from what we already have instead of waiting up to three seconds for the next poll.
  buildTasks(lastTasks, new Map(lastDrones.map((d) => [d.name, d])));
  buildDrones(lastDrones);
};

// ── mobile panel tabs ──────────────────────────────────────────────────────

for (const btn of document.querySelectorAll('#tabs button')) {
  btn.addEventListener('click', () => {
    const cls = 'show-' + btn.dataset.panel;
    const on = document.body.classList.contains(cls);
    // One panel at a time. On a phone two overlapping sheets leave no map visible, which defeats
    // the point of opening the map.
    document.body.classList.remove('show-hud', 'show-side', 'show-legend');
    for (const b of document.querySelectorAll('#tabs button')) b.classList.remove('on');
    if (!on) { document.body.classList.add(cls); btn.classList.add('on'); }
  });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── run ────────────────────────────────────────────────────────────────────

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  // A slow spin on the drone markers. Not decoration: it is the only cue that the page is live
  // rather than a frozen screenshot, in a world where most drones are usually idle.
  const t = performance.now() * 0.001;
  for (const c of gDrones.children) if (c.userData.drone) c.rotation.y = t * 0.6;
  renderer.render(scene, camera);
}
tick();

// Age counter, so a page left open overnight cannot quietly present stale data as current.
setInterval(() => {
  $('h-age').textContent = lastStateAt ? `${Math.round((Date.now() - lastStateAt) / 1000)}s ago` : 'never';
}, 1000);

const tickState = guarded(pollState);
const tickVoxels = guarded(pollVoxels);
tickState();
tickVoxels();
setInterval(tickState, STATE_MS);
setInterval(tickVoxels, VOXEL_MS);
</script>

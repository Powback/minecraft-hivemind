# HiveMind HQ — reachable at hive.pow on the LAN/VPN.
#
# The in-world Bridge dials ws://hive.pow/bridge, so this must be resolvable by
# Pi-hole and routed by Traefik like any other PowStation service. Websockets
# need no special Traefik config on the `web` entrypoint — the Upgrade handshake
# passes through as long as we do NOT put forward-auth in front of it (Authelia
# breaks the upgrade, which is exactly why .pow routes stay unauthenticated).
services:
  hq:
    build: .
    container_name: hive-hq
    environment:
      - PORT=4400
      - LUA_DIR=/lua
      # 60, not 56: the nearest real forest (a 27-log trunk column at -525,29 among others) sits 57
      # blocks from the base, and every tree inside 56 is gone. The mast's radio reaches 64 at ground
      # level; the two drones lost before were at 82. Wood is what chests, and therefore storage, wait on.
      - HIVE_REACH=60
    volumes:
      # The Lua tree HQ publishes at /lua/manifest and /lua/file/:path, which Sync.lua
      # pulls onto MainFrame's disk. Read-only: nothing in-game may write back.
      #
      # lua/ in THIS repo is the single source of truth for all in-world Lua. It moved here
      # from the server repo (minecraft-create121) because that repo is the Minecraft server
      # -- modpack, world, mods -- and the drone fleet is an application that merely runs
      # inside it. The server can be rebuilt or replaced without touching the fleet.
      #
      # There must be exactly one copy. HiveMind previously kept a second lua/ tree with a
      # hand-written 92-line PowNet stub whose protocol string ("pownet-server" vs the live
      # "PowNet:Server") meant its Bridge could never reach MainFrame, silently.
      - ../lua:/lua:ro
      # The plot registry. Losing it means losing the map of what the settlement IS, which would
      # let the next build order sit on top of something already there -- exactly the failure the
      # registry exists to prevent. So it outlives the container.
      - hive-state:/state
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hive.rule=Host(`hive.pow`)"
      - "traefik.http.routers.hive.entrypoints=web"
      - "traefik.http.services.hive.loadbalancer.server.port=4400"
    networks:
      - default
      - traefik

  # The fault monitor, as a service: it outlives terminal sessions, which the bin/ script does not.
  # RCON_PASSWORD comes from .env (gitignored); the game server's network is joined for tellraw.
  fleet-watch:
    build: ./watch
    container_name: hive-fleet-watch
    env_file: .env
    environment:
      - HQ_URL=http://hq:4400
      - POLL=60
      - RCON_HOST=mc-create121
    depends_on:
      - hq
    restart: unless-stopped
    networks:
      - default
      - minecraft

networks:
  default: {}
  traefik:
    external: true
  minecraft:
    external: true
    name: minecraft-create121_default

volumes:
  hive-state:
